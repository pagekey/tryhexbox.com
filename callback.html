<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HexBox OAuth | Success</title>
        <style>
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-dim: #94a3b8;
                --accent: #38bdf8;
                --accent-hover: #0ea5e9;
                --success: #22c55e;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
            }

            .container {
                background-color: var(--card-bg);
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
                width: 90%;
                max-width: 500px;
                text-align: center;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
                color: var(--accent);
            }

            p {
                color: var(--text-dim);
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
            }

            .code-wrapper {
                position: relative;
                background: #000;
                border-radius: 8px;
                padding: 1rem;
                margin-bottom: 1.5rem;
                border: 1px solid #334155;
            }

            #codeDisplay {
                font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                font-size: 0.85rem;
                color: var(--text-main);
                word-break: break-all;
                white-space: pre-wrap;
                text-align: left;
                margin: 0;
                display: block;
                min-height: 1.2rem;
            }

            .copy-btn {
                margin-top: 1rem;
                background-color: var(--accent);
                color: #000;
                border: none;
                padding: 0.75rem 1.5rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                width: 100%;
            }

            .copy-btn:hover {
                background-color: var(--accent-hover);
                transform: translateY(-1px);
            }

            .copy-btn:active {
                transform: translateY(0);
            }

            .copy-btn.success {
                background-color: var(--success);
                color: white;
            }

            .footer-note {
                font-size: 0.75rem;
                color: #475569;
                margin-top: 1rem;
            }
        </style>
    </head>
    <body>

        <div class="container">
            <h1>Authorization Complete</h1>
            <p>Paste this code into your HexBox terminal or dashboard to finish the setup.</p>

            <div class="code-wrapper">
                <code id="codeDisplay">Loading...</code>
            </div>

            <button class="copy-btn" id="copyBtn">Copy to Clipboard</button>

            <div class="footer-note">
        You can safely close this window after copying.
    </div>
        </div>

        <script>
            // 1. Extract the code from URL
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code") || "No code found in URL";
            const display = document.getElementById("codeDisplay");
            const btn = document.getElementById("copyBtn");

            display.textContent = code;

            // 2. Copy Functionality
            btn.addEventListener("click", async () => {
                try {
                    await navigator
                        .clipboard
                        .writeText(code);

                    // Visual feedback
                    const originalText = btn.textContent;
                    btn.textContent = "Copied!";
                    btn
                        .classList
                        .add("success");

                    setTimeout(() => {
                        btn.textContent = originalText;
                        btn
                            .classList
                            .remove("success");
                    }, 2000);
                } catch (err) {
                    console.error("Failed to copy: ", err);
                    alert("Please manualy select and copy the code.");
                }
            });
        </script>

    </body>
</html>
