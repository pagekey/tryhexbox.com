<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="referrer" content="no-referrer">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
        <script src="/callback.js"></script>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Connect Google Drive | HexBox</title>
        <style>
            :root {
                --bg: #0f172a;
                --card-bg: #1e293b;
                --text-main: #f8fafc;
                --text-dim: #94a3b8;
                --accent: #38bdf8;
                --accent-hover: #0ea5e9;
                --success: #22c55e;
            }

            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                background-color: var(--bg);
                color: var(--text-main);
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
            }

            .container {
                background-color: var(--card-bg);
                padding: 2rem;
                border-radius: 12px;
                box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
                width: 90%;
                max-width: 500px;
                text-align: center;
            }

            h1 {
                font-size: 1.5rem;
                margin-bottom: 0.5rem;
                color: var(--accent);
            }

            p {
                color: var(--text-dim);
                font-size: 0.95rem;
                margin-bottom: 1.5rem;
            }

            .code-wrapper {
                position: relative;
                background: #000;
                border-radius: 8px;
                padding: 1rem;
                margin-bottom: 1.5rem;
                border: 1px solid #334155;
            }

            #codeDisplay {
                font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                font-size: 0.85rem;
                color: var(--text-main);
                word-break: break-all;
                white-space: pre-wrap;
                text-align: left;
                margin: 0;
                display: block;
                min-height: 1.2rem;
                width: 100%;
                box-sizing: border-box;
                background: transparent;
                border: none;
                resize: vertical;
            }

            .copy-btn {
                margin-top: 1rem;
                background-color: var(--accent);
                color: #000;
                border: none;
                padding: 0.75rem 1.5rem;
                border-radius: 6px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.2s ease;
                width: 100%;
            }

            .copy-btn:hover {
                background-color: var(--accent-hover);
                transform: translateY(-1px);
            }

            .copy-btn:active {
                transform: translateY(0);
            }

            .copy-btn.success {
                background-color: var(--success);
                color: white;
            }

            .footer-note {
                font-size: 0.75rem;
                color: #475569;
                margin-top: 1rem;
            }
        </style>
    </head>
    <body>

        <div class="container">
            <h1 id="heading">Google Drive authorization</h1>
            <p id="message">Checking the authorization response…</p>

            <div id="result" hidden>
                <div class="code-wrapper">
                    <label for="codeDisplay">Connection code</label>
                    <textarea id="codeDisplay" readonly rows="8" autocomplete="off" spellcheck="false"></textarea>
                </div>
                <button type="button" class="copy-btn" id="copyBtn">Copy connection code</button>
                <p id="copyStatus" role="status"></p>
            </div>

            <div class="footer-note">
                Return to HexBox to finish connecting. You can close this window after copying.
            </div>
            <noscript>Enable JavaScript, then return to HexBox and start again.</noscript>
        </div>
    </body>
</html>
