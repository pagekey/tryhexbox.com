<!DOCTYPE html>
<html>
    <head>
        <title>Hexbox OAuth</title>
        <style>
            body {
                font-family: monospace;
                background-color: #111;
                color: #eee;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100vh;
            }
            input {
                width: 80%;
                max-width: 500px;
                padding: 8px;
                font-size: 1rem;
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <h1>Authorization Complete</h1>
        <p>Copy the code below and paste it into Hexbox:</p>
        <input id="codeBox" readonly/>
        <script>
            // Extract query parameters
            const params = new URLSearchParams(window.location.search);
            const code = params.get("code") || "No code found";

            // Display code in the input box
            const codeBox = document.getElementById("codeBox");
            codeBox.value = code;

            // Auto-select the code so user can copy quickly
            codeBox.focus();
            codeBox.select();
        </script>
    </body>
</html>
