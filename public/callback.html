<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="referrer" content="no-referrer">
        <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="theme-color" content="#111310">
        <script src="/callback.js"></script>
        <link rel="icon" type="image/svg+xml" href="/favicon.svg">
        <title>Connect Google Drive | HexBox</title>

        <style>
            :root {
                color-scheme: dark;
                --bg: #111310;
                --surface: #1a1d18;
                --surface-raised: #22261f;
                --border: #30362c;
                --text: #f1f3ed;
                --muted: #a0a69a;
                --subtle: #72796d;

                --accent: #f28c28;
                --accent-hover: #ffa343;
                --success: #f28c28;
                --error: #e6a09a;
            }
            * {
                box-sizing: border-box;
            }

            body {
                min-height: 100vh;
                margin: 0;
                padding: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                background: radial-gradient(ellipse at 50% 35%, #252c20 0%, transparent 55%), var(--bg);
                color: var(--text);
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            .page {
                width: 100%;
                max-width: 440px;
            }

            .brand {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                margin-bottom: 28px;
                color: var(--text);
                font-size: 18px;
                font-weight: 700;
                letter-spacing: -0.6px;
            }

            .brand-mark {
                display: grid;
                place-items: center;
                width: 34px;
                height: 34px;
                border: 1px solid #70451f;
                border-radius: 10px;
                background: #382719;
                color: var(--accent);
                font-size: 19px;
                font-weight: 700;
            }

            .brand span:last-child {
                color: var(--muted);
                font-weight: 400;
            }

            .card {
                padding: 36px;
                border: 1px solid var(--border);
                border-radius: 18px;
                background: var(--surface);
                box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
            }

            .status-icon {
                display: grid;
                place-items: center;
                width: 48px;
                height: 48px;
                margin-bottom: 24px;
                border: 1px solid #70451f;
                border-radius: 14px;
                background: #382719;
                color: var(--accent);
                font-size: 23px;
            }

            .status-icon.error {
                border-color: #63413e;
                background: #382725;
                color: var(--error);
            }

            .eyebrow {
                margin: 0 0 10px;
                color: var(--accent);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 1.5px;
                text-transform: uppercase;
            }

            h1 {
                margin: 0;
                color: var(--text);
                font-size: 26px;
                font-weight: 650;
                letter-spacing: -0.9px;
                line-height: 1.25;
            }

            .description {
                margin: 12px 0 28px;
                color: var(--muted);
                font-size: 14px;
                line-height: 1.7;
            }

            .code-section {
                margin-top: 28px;
            }

            .code-heading {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                margin-bottom: 10px;
            }

            .code-heading label {
                color: var(--text);
                font-size: 13px;
                font-weight: 600;
            }

            .code-badge {
                padding: 4px 8px;
                border: 1px solid var(--border);
                border-radius: 20px;
                color: var(--subtle);
                font-size: 10px;
                font-weight: 600;
                letter-spacing: 0.5px;
                text-transform: uppercase;
            }

            .code-wrapper {
                padding: 14px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: #111310;
            }

            #codeDisplay {
                display: block;
                width: 100%;
                min-height: 108px;
                padding: 0;
                resize: vertical;
                border: 0;
                outline: none;
                background: transparent;
                color: #f3bd83;
                font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
                font-size: 12px;
                line-height: 1.7;
                overflow-wrap: anywhere;
                word-break: break-all;
            }

            .copy-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 9px;
                width: 100%;
                min-height: 48px;
                margin-top: 14px;
                padding: 12px 18px;
                border: 0;
                border-radius: 9px;
                background: var(--accent);
                color: #1a2112;
                font-family: inherit;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                transition: background 150ms ease, transform 150ms ease;
            }

            .copy-btn:hover {
                background: var(--accent-hover);
                transform: translateY(-1px);
            }

            .copy-btn:active {
                transform: translateY(0);
            }

            .copy-btn.success {
                background: #34472a;
                color: var(--success);
                border: 1px solid #526b3f;
            }

            .copy-btn:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 3px;
            }

            #copyStatus {
                min-height: 20px;
                margin: 10px 0 0;
                color: var(--success);
                font-size: 12px;
                line-height: 1.5;
                text-align: center;
            }

            .instructions {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                margin-top: 24px;
                padding: 14px;
                border: 1px solid var(--border);
                border-radius: 10px;
                background: var(--surface-raised);
            }

            .instructions-icon {
                flex-shrink: 0;
                color: var(--accent);
                font-size: 16px;
            }

            .instructions p {
                margin: 0;
                color: var(--muted);
                font-size: 12px;
                line-height: 1.6;
            }

            .instructions strong {
                color: var(--text);
                font-weight: 600;
            }

            .footer {
                margin-top: 22px;
                color: var(--subtle);
                font-size: 11px;
                line-height: 1.6;
                text-align: center;
            }

            noscript {
                display: block;
                margin-top: 20px;
                color: var(--error);
                font-size: 13px;
                text-align: center;
            }

            [hidden] {
                display: none !important;
            }

            @media (max-width: 480px) {
                body {
                    padding: 18px;
                    align-items: center;
                }

                .brand {
                    margin-bottom: 22px;
                }

                .card {
                    padding: 26px 22px;
                    border-radius: 14px;
                }

                h1 {
                    font-size: 23px;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::after,
                *::before {
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                }
            }
        </style>
    </head>

    <body>
        <main class="page">
            <div class="brand" aria-label="HexBox">
                <div class="brand-mark">H</div>
                <div>HexBox <span>/ Connect</span></div>
            </div>

            <section class="card">
                <div class="status-icon" id="statusIcon" aria-hidden="true">
                    <span id="statusSymbol">↗</span>
                </div>

                <p class="eyebrow" id="eyebrow">Google Drive</p>

                <h1 id="heading">Google Drive authorization</h1>

                <p class="description" id="message" aria-live="polite">
                    Checking the authorization response…
                </p>

                <div id="result" hidden>
                    <div class="code-section">
                        <div class="code-heading">
                            <label for="codeDisplay">Your connection code</label>
                            <span class="code-badge">Temporary code</span>
                        </div>

                        <div class="code-wrapper">
                            <textarea
                                id="codeDisplay"
                                readonly
                                rows="5"
                                autocomplete="off"
                                autocapitalize="off"
                                spellcheck="false"
                                aria-label="Google Drive connection code"
                            ></textarea>
                        </div>

                        <button type="button" class="copy-btn" id="copyBtn">
                            <span aria-hidden="true">▢</span>
                            <span id="copyLabel">Copy connection code</span>
                        </button>

                        <p id="copyStatus" role="status" aria-live="polite"></p>
                    </div>

                    <div class="instructions">
                        <span class="instructions-icon" aria-hidden="true">↩</span>
                        <p>
                            <strong>Almost there.</strong>
                            Return to your HexBox and select
                            <strong>Finish connecting</strong> to complete setup.
                        </p>
                    </div>
                </div>

                <div class="footer">
                    Secure connection · HexBox
                </div>

                <noscript>
                    JavaScript is required. Enable it, then return to HexBox and start again.
                </noscript>
            </section>
        </main>
    </body>
</html>
